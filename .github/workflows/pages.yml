name: Website

# Builds the static site in site/ and publishes it with GitHub Pages.
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build-site.mjs', 'docs/screenshots/**', 'docs/social-preview.png', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for uploaded artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for ATTEMPT in {1..12}; do
            COUNT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq "[.artifacts[] | select(.name == \"${ARTIFACT_NAME}\" and .expired == false)] | length")"
            if test "${COUNT}" = 1; then exit 0; fi
            if test "${COUNT}" -gt 1; then
              echo "::error::Multiple artifacts found for ${ARTIFACT_NAME}"
              exit 1
            fi
            sleep 5
          done
          echo "::error::Uploaded artifact metadata did not become visible"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
