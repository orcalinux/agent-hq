name: Release

# Push a tag like v0.2.0 (matching package.json) to build the desktop installers
# and publish them, with the auto-update files, to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:electron
      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Verify all platforms and update files are present
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for FILE in \
            "Agent-HQ-${VERSION}-linux-amd64.deb" \
            "Agent-HQ-${VERSION}-linux-x86_64.AppImage" \
            "Agent-HQ-${VERSION}-linux-x86_64.rpm" \
            "Agent-HQ-${VERSION}-win-x64.exe" \
            "Agent-HQ-${VERSION}-win-x64.exe.blockmap" \
            "Agent-HQ-${VERSION}-mac-arm64.dmg" \
            "Agent-HQ-${VERSION}-mac-arm64.zip" \
            "Agent-HQ-${VERSION}-mac-arm64.zip.blockmap" \
            "Agent-HQ-${VERSION}-mac-x64.dmg" \
            "Agent-HQ-${VERSION}-mac-x64.zip" \
            "Agent-HQ-${VERSION}-mac-x64.zip.blockmap" \
            latest-linux.yml latest-mac.yml latest.yml; do
            test -s "release-assets/${FILE}" || { echo "Missing release asset: ${FILE}"; exit 1; }
          done
      - name: Generate release notes and installer checksums
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > notes.md
          cd release-assets
          sha256sum *.AppImage *.deb *.rpm *.exe *.dmg *.zip > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Upload the complete set and publish once
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --draft --title "Agent HQ ${GITHUB_REF_NAME}" --notes-file notes.md
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --repo "${GITHUB_REPOSITORY}" --clobber
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --notes-file notes.md --title "Agent HQ ${GITHUB_REF_NAME}" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
